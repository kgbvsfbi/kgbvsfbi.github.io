    <script>
      // 공유 문장의 링크(firstComMono#3148). 받는 사람의 기기를 보고 스토어로 넘긴다 — 그 밖의 기기와
      // LIVE가 false인 동안(스토어 페이지가 열리기 전)은 아래 버튼 페이지가 그대로 보인다. 출시 때 LIVE만 true로 바꾼다.
      (function () {
        var LIVE = false;
        var IOS = "https://apps.apple.com/app/id6821070961";
        var ANDROID = "https://play.google.com/store/apps/details?id=com.firstcom.tessera";
        if (!LIVE) return;
        var ua = navigator.userAgent || "";
        // iPadOS Safari는 맥 UA를 보내므로 터치 지점 수로 가른다
        var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        if (ios) location.replace(IOS);
        else if (/Android/.test(ua)) location.replace(ANDROID);
      })();
    </script>
